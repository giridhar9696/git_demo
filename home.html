<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        nav {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav h1 {
            color: white;
            font-size: 1.8rem;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            background-color: #667eea;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
        }
        
        nav a:hover {
            background-color: #764ba2;
        }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 2rem;
        }
        
        h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 600px;
        }
        
        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background-color: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin: 0.5rem;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }
        
        .btn:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <nav>
        <h1>My Website</h1>
        <a onclick="logout()">Logout</a>
    </nav>
    
    <div class="container">
        <h2>Welcome to Your Dashboard!</h2>
        <p>You've successfully signed up. Start exploring our features and make the most of your account.</p>
        <a href="#" class="btn">Explore Features</a>
        <a href="#" class="btn">Settings</a>
    </div>
    
    <script>
        function logout() {
            // Clear session/localStorage if used
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
